name: fixture-good

services:
  fixture-good-app:
    image: docker.openhands.dev/openhands/openhands:1.8
    container_name: fixture-good-app
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      LOG_ALL_EVENTS: "true"

    mem_limit: 2g
    cpus: "1.0"
    pids_limit: 512

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
