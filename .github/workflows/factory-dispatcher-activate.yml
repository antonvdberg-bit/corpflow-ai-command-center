# LEGACY / DIAGNOSTIC / NOT PRODUCTION EXECUTION (#930).
#
# This Background Agents API activator is NOT the production Cursor executor
# and must not compete with Cursor Automation CorpFlowAI Factory Wake Proof.
#
# Production path (sole executor):
#   GitHub eligible work
#   → CorpFlowAI Cursor Factory Handoff
#   → Cursor Automation CorpFlowAI Factory Wake Proof / MODE B
#   → Cursor Cloud agent → one branch → one PR.
#
# Manual workflow_dispatch only. Do not restore schedule, issues, issue_comment,
# or workflow_call — those automatic triggers launch a second competing worker.
# Default remains dry_run. cursor_live is diagnostic smoke only.
#
# Repo secrets (Settings → Secrets and variables → Actions):
# - CORPFLOW_CORE_BASE_URL   e.g. https://core.corpflowai.com
# - CORPFLOW_CRON_SECRET     same value as Vercel CORPFLOW_CRON_SECRET / CRON_SECRET
# - CORPFLOW_FACTORY_HEALTH_URL  (optional) fallback to derive dispatcher URL
# - CURSOR_API_KEY           required for activation_mode=cursor_live only (never logged)
#
# If dispatcher secrets are missing, the job exits 0 (skipped) so forks stay green.
#
# References:
#   docs/execution/DISPATCHER_AGENT_ACTIVATION_V1.md
#   docs/operations/CURSOR_ISSUE_DISPATCH_LIFECYCLE_V1.md
#   scripts/dispatcher-agent-activation.mjs
#   scripts/cursor-issue-dispatch-scan.mjs
#   lib/server/cursor-ready-event-dispatch.js

name: LEGACY Factory dispatcher activate (diagnostic - not production execution)

# STARTED/FINISHED evidence comments post to control issue #661 so a silent UI click cannot hide the run ID.
on:
  workflow_dispatch:
    inputs:
      activation_mode:
        description: "dry_run (default) or cursor_live (LEGACY diagnostic smoke only — not production)"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - cursor_live
      smoke_internal:
        description: "Inject internal cursor smoke routing when no cursor routings (first smoke)"
        required: false
        default: false
        type: boolean
      target_issue:
        description: "Optional GitHub issue number for direct Cursor activation (manual diagnostic only; blank = dispatcher)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write
  actions: read

# Manual diagnostic only — serialize by target issue when provided.
concurrency:
  group: factory-dispatcher-activate-legacy-${{ inputs.target_issue || 'scan' }}
  cancel-in-progress: false

jobs:
  activate:
    # workflow_dispatch only. Automatic schedule / label / comment / capacity
    # wakes belong to CorpFlowAI Cursor Factory Handoff (#930).
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Pinned SHAs (supply chain): tag v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Pinned SHAs (supply chain): tag v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "20"

      - name: Resolve activation mode
        id: mode
        env:
          CURSOR_LIVE_ENABLED: ${{ vars.CURSOR_LIVE_ENABLED || secrets.CURSOR_LIVE_ENABLED || '' }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          EVENT_LABEL: ${{ github.event.label.name || '' }}
          EVENT_ISSUE_STATE: ${{ github.event.issue.state || '' }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          EVENT_ISSUE_LABELS: ${{ github.event_name == 'issues' && join(github.event.issue.labels.*.name, ',') || '' }}
          EVENT_COMMENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          EVENT_ACTOR_LOGIN: ${{ github.event_name == 'issue_comment' && github.event.comment.user.login || github.actor || '' }}
          EVENT_COMMENT_AUTHOR_ASSOCIATION: ${{ github.event_name == 'issue_comment' && github.event.comment.author_association || '' }}
          ACTIVATION_MODE_INPUT: ${{ inputs.activation_mode || '' }}
          SMOKE_INTERNAL_INPUT: ${{ inputs.smoke_internal || '' }}
          TARGET_ISSUE_INPUT: ${{ inputs.target_issue || '' }}
          WAKE_REASON_INPUT: ${{ inputs.wake_reason || '' }}
          CAPACITY_WAKE_REQUESTED: ${{ inputs.capacity_wake_requested || '' }}
        run: |
          set -euo pipefail
          node scripts/factory-dispatcher-resolve-mode.mjs --phase mode

      - name: Skip when wake predicate soft-rejects
        if: ${{ steps.mode.outputs.should_run != '1' }}
        run: echo "Wake predicate soft-rejected — no activation this run"

      - name: Post STARTED evidence to control issue
        if: ${{ steps.mode.outputs.should_run == '1' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DISPATCHER_ACTIVATION_MODE: ${{ steps.mode.outputs.mode }}
          DISPATCHER_ACTIVATION_TARGET_ISSUE: ${{ steps.mode.outputs.evidence_target_issue }}
          CURSOR_LIVE_ENABLED_CONFIGURED: ${{ steps.mode.outputs.cursor_live_enabled_configured }}
          CURSOR_LIVE_ENABLED_TRUTHY: ${{ steps.mode.outputs.cursor_live_enabled_truthy }}
          DISPATCHER_CONTROL_ISSUE: "661"
          DISPATCHER_RUN_EVIDENCE_PATH: dispatcher-run-evidence-started.json
        run: |
          set -euo pipefail
          node scripts/dispatcher-run-evidence.mjs --phase started

      # Pinned SHAs (supply chain): tag v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: ${{ steps.mode.outputs.should_run == '1' }}
        continue-on-error: true
        id: dedupe-cache
        with:
          path: .dispatcher-activation-state
          key: dispatcher-activation-dedupe-v1-${{ github.repository }}
          restore-keys: |
            dispatcher-activation-dedupe-v1-${{ github.repository }}

      - name: Show integration status (presence-only)
        if: ${{ steps.mode.outputs.should_run == '1' }}
        run: |
          set -euo pipefail
          echo "Dispatcher activator mode: ${{ steps.mode.outputs.mode }}"
          echo "  path                       : ${{ steps.mode.outputs.path }}"
          echo "  wake_reason                : ${{ steps.mode.outputs.wake_reason }}"
          if [ -n "${{ steps.mode.outputs.event_issue }}" ]; then
            echo "  event_issue                : ${{ steps.mode.outputs.event_issue }} (eligibility/label event)"
          fi
          if [ -n "${{ steps.mode.outputs.target_issue }}" ]; then
            echo "  target_issue               : ${{ steps.mode.outputs.target_issue }} (manual direct-issue path)"
          else
            echo "  target_issue               : (blank — scan/dispatcher; gates authoritative)"
          fi
          if [ -n "${CORE_BASE_PRESENT:-}" ] || [ -n "${HEALTH_URL_PRESENT:-}" ]; then
            echo "  dispatcher URL source       : configured"
          else
            echo "  dispatcher URL source       : SKIPPED (set CORPFLOW_CORE_BASE_URL or CORPFLOW_FACTORY_HEALTH_URL)"
          fi
          if [ -n "${CRON_SECRET_PRESENT:-}" ]; then
            echo "  CORPFLOW_CRON_SECRET        : configured"
          else
            echo "  CORPFLOW_CRON_SECRET        : SKIPPED"
          fi
          if [ -n "${CURSOR_KEY_PRESENT:-}" ]; then
            echo "  CURSOR_API_KEY              : configured"
          else
            echo "  CURSOR_API_KEY              : not set (required for cursor_live)"
          fi
          if [ -n "${CURSOR_LIVE_ENABLED_PRESENT:-}" ]; then
            echo "  CURSOR_LIVE_ENABLED         : configured (value not logged)"
          else
            echo "  CURSOR_LIVE_ENABLED         : not set (scheduled cursor_live disabled)"
          fi
        env:
          CORE_BASE_PRESENT: ${{ secrets.CORPFLOW_CORE_BASE_URL != '' && '1' || '' }}
          HEALTH_URL_PRESENT: ${{ secrets.CORPFLOW_FACTORY_HEALTH_URL != '' && '1' || '' }}
          CRON_SECRET_PRESENT: ${{ secrets.CORPFLOW_CRON_SECRET != '' && '1' || '' }}
          CURSOR_KEY_PRESENT: ${{ secrets.CURSOR_API_KEY != '' && '1' || '' }}
          CURSOR_LIVE_ENABLED_PRESENT: ${{ (vars.CURSOR_LIVE_ENABLED != '' || secrets.CURSOR_LIVE_ENABLED != '') && '1' || '' }}

      - name: Scan dispatch:cursor-ready issues (segregated lifecycle)
        if: ${{ steps.mode.outputs.should_run == '1' }}
        id: issue_scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CURSOR_ISSUE_DISPATCH_SCAN_PATH: cursor-issue-dispatch-scan.json
          DISPATCH_PREFER_ISSUES: ${{ steps.mode.outputs.prefer_issues }}
        run: |
          set -euo pipefail
          # GHA token has issues:write — durable discovery/classification comments only.
          # Pre-API claim is acquired in dispatcher-agent-activation (claim-before-API);
          # finalize still records the real Cursor run ID / origin metadata after success.
          # Event path prefers the exact labeled/authorized issue; WIP/protected gates still decide claim.
          if [ -n "${DISPATCH_PREFER_ISSUES:-}" ]; then
            node scripts/cursor-issue-dispatch-scan.mjs --apply-comments --prefer "${DISPATCH_PREFER_ISSUES}"
          else
            node scripts/cursor-issue-dispatch-scan.mjs --apply-comments
          fi
          if [ -f cursor-issue-dispatch-scan.json ]; then
            target="$(node -e "const j=require('./cursor-issue-dispatch-scan.json'); process.stdout.write(j.activationTargetIssue!=null?String(j.activationTargetIssue):'')")"
            echo "activation_target_issue=${target}" >> "$GITHUB_OUTPUT"
            echo "Issue scan activationTargetIssue=${target:-none}"
          else
            echo "activation_target_issue=" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve effective target issue
        if: ${{ steps.mode.outputs.should_run == '1' }}
        id: target
        env:
          MANUAL_TARGET: ${{ steps.mode.outputs.target_issue }}
          EVENT_ISSUE: ${{ steps.mode.outputs.event_issue }}
          SCANNED_TARGET: ${{ steps.issue_scan.outputs.activation_target_issue }}
          REQUIRE_EXACT_EVENT_ISSUE: ${{ steps.mode.outputs.require_exact_event_issue }}
          WAKE_PATH: ${{ steps.mode.outputs.path }}
        run: |
          set -euo pipefail
          node scripts/factory-dispatcher-resolve-mode.mjs --phase target

      - name: Run dispatcher activation
        # Prefer-exact holds and soft-rejects must not call Cursor API.
        if: ${{ steps.mode.outputs.should_run == '1' && steps.target.outputs.activate == '1' }}
        env:
          DISPATCHER_ACTIVATION_MODE: ${{ steps.mode.outputs.mode }}
          ACTIVATION_MODE: ${{ steps.mode.outputs.mode }}
          DISPATCHER_ACTIVATION_SMOKE_INTERNAL: ${{ steps.mode.outputs.smoke_internal }}
          DISPATCHER_ACTIVATION_TARGET_ISSUE: ${{ steps.target.outputs.target_issue }}
          DISPATCHER_ACTIVATION_TARGET_SOURCE: ${{ steps.target.outputs.target_source }}
          TARGET_ISSUE: ${{ steps.target.outputs.target_issue }}
          DISPATCHER_ACTIVATION_EVENT_NAME: ${{ github.event_name }}
          DISPATCHER_ACTIVATION_STATE_PATH: .dispatcher-activation-state/dedupe.json
          CURSOR_LIVE_ENABLED: ${{ vars.CURSOR_LIVE_ENABLED || secrets.CURSOR_LIVE_ENABLED || '' }}
          CORPFLOW_CORE_BASE_URL: ${{ secrets.CORPFLOW_CORE_BASE_URL }}
          CORPFLOW_FACTORY_HEALTH_URL: ${{ secrets.CORPFLOW_FACTORY_HEALTH_URL }}
          CORPFLOW_CRON_SECRET: ${{ secrets.CORPFLOW_CRON_SECRET }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_SHA: ${{ github.sha }}
          DISPATCHER_ACTIVATION_POST_COMMENT: "1"
        run: node scripts/dispatcher-agent-activation.mjs --fetch --activate --persist-dedupe

      - name: Finalize dispatch claim (run ID + origin metadata)
        if: ${{ always() && steps.mode.outputs.should_run == '1' }}
        id: finalize
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPO: ${{ github.repository }}
          CURSOR_ISSUE_DISPATCH_SCAN_PATH: cursor-issue-dispatch-scan.json
          DISPATCHER_ACTIVATION_PLAN_PATH: activation-plan.json
          CURSOR_OPS_STATUS_PATH: cursor-ops-status.json
          TARGET_ISSUE: ${{ steps.target.outputs.target_issue }}
        run: |
          set -euo pipefail
          # Always attempt finalize when we have a target issue (manual, event, or scan).
          # Pre-API claim may already hold dispatch:cursor-claimed; finalize records run ID
          # or releases the claim on failure.
          if [ -f activation-plan.json ] || [ -n "${TARGET_ISSUE:-}" ]; then
            node scripts/cursor-issue-dispatch-finalize.mjs \
              --scan-file cursor-issue-dispatch-scan.json \
              --activation-file activation-plan.json \
              --ops-status-file cursor-ops-status.json | tee dispatcher-finalize-result.json || true
            rolled="$(node -e "try{const j=require('./dispatcher-finalize-result.json');process.stdout.write(j.rolledBack?'1':'0')}catch{process.stdout.write('0')}")"
            echo "rolled_back=${rolled}" >> "$GITHUB_OUTPUT"
          else
            echo "No activation target — skip finalize"
            echo "rolled_back=0" >> "$GITHUB_OUTPUT"
          fi

      # Failed activation restores ready via GITHUB_TOKEN (no issues:labeled re-fire).
      # One same-job continuation scan backfills the next highest eligible issue (#891).
      - name: Continuation scan after claim release
        if: ${{ always() && steps.mode.outputs.should_run == '1' && steps.finalize.outputs.rolled_back == '1' && steps.mode.outputs.path != 'claim_release_continuation' }}
        id: continuation
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CURSOR_ISSUE_DISPATCH_SCAN_PATH: cursor-issue-dispatch-scan-continuation.json
          DISPATCHER_ACTIVATION_MODE: ${{ steps.mode.outputs.mode }}
          ACTIVATION_MODE: ${{ steps.mode.outputs.mode }}
          DISPATCHER_ACTIVATION_SMOKE_INTERNAL: "0"
          DISPATCHER_ACTIVATION_STATE_PATH: .dispatcher-activation-state/dedupe.json
          CURSOR_LIVE_ENABLED: ${{ vars.CURSOR_LIVE_ENABLED || secrets.CURSOR_LIVE_ENABLED || '' }}
          CORPFLOW_CORE_BASE_URL: ${{ secrets.CORPFLOW_CORE_BASE_URL }}
          CORPFLOW_FACTORY_HEALTH_URL: ${{ secrets.CORPFLOW_FACTORY_HEALTH_URL }}
          CORPFLOW_CRON_SECRET: ${{ secrets.CORPFLOW_CRON_SECRET }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_SHA: ${{ github.sha }}
          DISPATCHER_ACTIVATION_POST_COMMENT: "1"
          DISPATCHER_ACTIVATION_EVENT_NAME: workflow_call
          DISPATCHER_ACTIVATION_PLAN_PATH: activation-plan-continuation.json
          CURSOR_OPS_STATUS_PATH: cursor-ops-status-continuation.json
        run: |
          set -euo pipefail
          echo "Claim released — running one continuation queue scan (no recursive workflow)"
          node scripts/cursor-issue-dispatch-scan.mjs --apply-comments
          target="$(node -e "const j=require('./cursor-issue-dispatch-scan-continuation.json'); process.stdout.write(j.activationTargetIssue!=null?String(j.activationTargetIssue):'')")"
          echo "continuation_target=${target}" >> "$GITHUB_OUTPUT"
          if [ -z "${target}" ]; then
            echo "No eligible issue after claim release — done"
            exit 0
          fi
          export DISPATCHER_ACTIVATION_TARGET_ISSUE="${target}"
          export TARGET_ISSUE="${target}"
          export DISPATCHER_ACTIVATION_TARGET_SOURCE="claim_release_continuation"
          node scripts/dispatcher-agent-activation.mjs --fetch --activate --persist-dedupe || true
          node scripts/cursor-issue-dispatch-finalize.mjs \
            --scan-file cursor-issue-dispatch-scan-continuation.json \
            --activation-file activation-plan-continuation.json \
            --ops-status-file cursor-ops-status-continuation.json || true

      - name: Post FINISHED evidence to control issue
        if: ${{ always() && steps.mode.outputs.should_run == '1' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          DISPATCHER_ACTIVATION_MODE: ${{ steps.mode.outputs.mode }}
          DISPATCHER_ACTIVATION_TARGET_ISSUE: ${{ steps.target.outputs.target_issue }}
          CURSOR_LIVE_ENABLED_CONFIGURED: ${{ steps.mode.outputs.cursor_live_enabled_configured }}
          CURSOR_LIVE_ENABLED_TRUTHY: ${{ steps.mode.outputs.cursor_live_enabled_truthy }}
          CURSOR_ISSUE_DISPATCH_SCAN_PATH: cursor-issue-dispatch-scan.json
          DISPATCHER_ACTIVATION_PLAN_PATH: activation-plan.json
          CURSOR_OPS_STATUS_PATH: cursor-ops-status.json
          DISPATCHER_CONTROL_ISSUE: "661"
          DISPATCHER_RUN_EVIDENCE_PATH: dispatcher-run-evidence-finished.json
        run: |
          set -euo pipefail
          node scripts/dispatcher-run-evidence.mjs --phase finished

      - name: Upload activation result artifact (always)
        if: ${{ always() && steps.mode.outputs.should_run == '1' }}
        # Pinned SHAs (supply chain): tag v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dispatcher-activation-result
          path: |
            activation-plan.json
            activation-plan-continuation.json
            activation-audit.json
            cursor-ops-status.json
            cursor-ops-status-continuation.json
            cursor-issue-dispatch-scan.json
            cursor-issue-dispatch-scan-continuation.json
            dispatcher-finalize-result.json
            dispatcher-run-evidence-started.json
            dispatcher-run-evidence-finished.json
            .dispatcher-activation-state/dedupe.json
          if-no-files-found: ignore
          retention-days: 7
