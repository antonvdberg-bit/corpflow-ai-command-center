# Polls business-operations dispatcher and runs agent activation.
# Default: dry-run plan only. Manual workflow_dispatch may set activation_mode=cursor_live.
# Optional target_issue bypasses dispatcher cursor routings for one direct GitHub issue.
# Scheduled runs become cursor_live only when repository variable/secret CURSOR_LIVE_ENABLED=true.
#
# Also scans open issues labelled dispatch:cursor-ready (segregated claim lifecycle) before
# activation. Does not create a second dispatcher — see CURSOR_ISSUE_DISPATCH_LIFECYCLE_V1.
#
# Repo secrets (Settings → Secrets and variables → Actions):
# - CORPFLOW_CORE_BASE_URL   e.g. https://core.corpflowai.com
# - CORPFLOW_CRON_SECRET     same value as Vercel CORPFLOW_CRON_SECRET / CRON_SECRET
# - CORPFLOW_FACTORY_HEALTH_URL  (optional) fallback to derive dispatcher URL
# - CURSOR_API_KEY           required for activation_mode=cursor_live only (never logged)
# - CURSOR_LIVE_ENABLED      optional repo variable/secret; true enables scheduled cursor_live
#
# If dispatcher secrets are missing, the job exits 0 (skipped) so forks stay green.
#
# References:
#   docs/execution/DISPATCHER_AGENT_ACTIVATION_V1.md
#   docs/operations/CURSOR_ISSUE_DISPATCH_LIFECYCLE_V1.md
#   scripts/dispatcher-agent-activation.mjs
#   scripts/cursor-issue-dispatch-scan.mjs

name: Factory dispatcher activate

on:
  schedule:
    # Every 30 minutes — issue-label scan + dry_run unless CURSOR_LIVE_ENABLED=true
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      activation_mode:
        description: "dry_run (default) or cursor_live (manual smoke only)"
        required: true
        default: dry_run
        type: choice
        options:
          - dry_run
          - cursor_live
      smoke_internal:
        description: "Inject internal cursor smoke routing when no cursor routings (first smoke)"
        required: false
        default: false
        type: boolean
      target_issue:
        description: "Optional GitHub issue number for direct Cursor activation (manual only; blank = dispatcher)"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: factory-dispatcher-activate
  cancel-in-progress: false

jobs:
  activate:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      # Pinned SHAs (supply chain): tag v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Pinned SHAs (supply chain): tag v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "20"

      - name: Resolve activation mode
        id: mode
        env:
          CURSOR_LIVE_ENABLED: ${{ vars.CURSOR_LIVE_ENABLED || secrets.CURSOR_LIVE_ENABLED || '' }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            live_enabled="$(printf '%s' "${CURSOR_LIVE_ENABLED:-}" | tr '[:upper:]' '[:lower:]')"
            if [ "$live_enabled" = "true" ] || [ "$live_enabled" = "1" ] || [ "$live_enabled" = "enabled" ]; then
              echo "mode=cursor_live" >> "$GITHUB_OUTPUT"
              echo "Scheduled run — CURSOR_LIVE_ENABLED is enabled; cursor_live requires throughput packet gate"
            else
              echo "mode=dry_run" >> "$GITHUB_OUTPUT"
              echo "Scheduled run — forcing dry_run because CURSOR_LIVE_ENABLED is not true"
            fi
            echo "smoke_internal=0" >> "$GITHUB_OUTPUT"
            echo "target_issue=" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${{ inputs.activation_mode }}" >> "$GITHUB_OUTPUT"
            if [ "${{ inputs.smoke_internal }}" = "true" ]; then
              echo "smoke_internal=1" >> "$GITHUB_OUTPUT"
            else
              echo "smoke_internal=0" >> "$GITHUB_OUTPUT"
            fi
            echo "target_issue=${{ inputs.target_issue }}" >> "$GITHUB_OUTPUT"
            echo "Manual run — activation_mode=${{ inputs.activation_mode }} smoke_internal=${{ inputs.smoke_internal }} target_issue=${{ inputs.target_issue }}"
          fi

      # Pinned SHAs (supply chain): tag v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        continue-on-error: true
        id: dedupe-cache
        with:
          path: .dispatcher-activation-state
          key: dispatcher-activation-dedupe-v1-${{ github.repository }}
          restore-keys: |
            dispatcher-activation-dedupe-v1-${{ github.repository }}

      - name: Show integration status (presence-only)
        run: |
          set -euo pipefail
          echo "Dispatcher activator mode: ${{ steps.mode.outputs.mode }}"
          if [ -n "${{ steps.mode.outputs.target_issue }}" ]; then
            echo "  target_issue               : ${{ steps.mode.outputs.target_issue }} (direct-issue path)"
          else
            echo "  target_issue               : (blank — dispatcher fetch)"
          fi
          if [ -n "${CORE_BASE_PRESENT:-}" ] || [ -n "${HEALTH_URL_PRESENT:-}" ]; then
            echo "  dispatcher URL source       : configured"
          else
            echo "  dispatcher URL source       : SKIPPED (set CORPFLOW_CORE_BASE_URL or CORPFLOW_FACTORY_HEALTH_URL)"
          fi
          if [ -n "${CRON_SECRET_PRESENT:-}" ]; then
            echo "  CORPFLOW_CRON_SECRET        : configured"
          else
            echo "  CORPFLOW_CRON_SECRET        : SKIPPED"
          fi
          if [ -n "${CURSOR_KEY_PRESENT:-}" ]; then
            echo "  CURSOR_API_KEY              : configured"
          else
            echo "  CURSOR_API_KEY              : not set (required for cursor_live)"
          fi
          if [ -n "${CURSOR_LIVE_ENABLED_PRESENT:-}" ]; then
            echo "  CURSOR_LIVE_ENABLED         : configured (value not logged)"
          else
            echo "  CURSOR_LIVE_ENABLED         : not set (scheduled cursor_live disabled)"
          fi
        env:
          CORE_BASE_PRESENT: ${{ secrets.CORPFLOW_CORE_BASE_URL != '' && '1' || '' }}
          HEALTH_URL_PRESENT: ${{ secrets.CORPFLOW_FACTORY_HEALTH_URL != '' && '1' || '' }}
          CRON_SECRET_PRESENT: ${{ secrets.CORPFLOW_CRON_SECRET != '' && '1' || '' }}
          CURSOR_KEY_PRESENT: ${{ secrets.CURSOR_API_KEY != '' && '1' || '' }}
          CURSOR_LIVE_ENABLED_PRESENT: ${{ (vars.CURSOR_LIVE_ENABLED != '' || secrets.CURSOR_LIVE_ENABLED != '') && '1' || '' }}

      - name: Scan dispatch:cursor-ready issues (segregated lifecycle)
        id: issue_scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CURSOR_ISSUE_DISPATCH_SCAN_PATH: cursor-issue-dispatch-scan.json
        run: |
          set -euo pipefail
          # GHA token has issues:write — durable discovery/classification comments only.
          # Claim labels are applied after Cursor API returns a real run ID (finalize step).
          node scripts/cursor-issue-dispatch-scan.mjs --apply-comments
          if [ -f cursor-issue-dispatch-scan.json ]; then
            target="$(node -e "const j=require('./cursor-issue-dispatch-scan.json'); process.stdout.write(j.activationTargetIssue!=null?String(j.activationTargetIssue):'')")"
            echo "activation_target_issue=${target}" >> "$GITHUB_OUTPUT"
            echo "Issue scan activationTargetIssue=${target:-none}"
          else
            echo "activation_target_issue=" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve effective target issue
        id: target
        run: |
          set -euo pipefail
          # Manual workflow_dispatch target_issue wins; else use scan claim handoff.
          manual="${{ steps.mode.outputs.target_issue }}"
          scanned="${{ steps.issue_scan.outputs.activation_target_issue }}"
          if [ -n "${manual}" ]; then
            echo "target_issue=${manual}" >> "$GITHUB_OUTPUT"
            echo "Effective target_issue=${manual} (manual)"
          elif [ -n "${scanned}" ]; then
            echo "target_issue=${scanned}" >> "$GITHUB_OUTPUT"
            echo "Effective target_issue=${scanned} (issue-label scan claim)"
          else
            echo "target_issue=" >> "$GITHUB_OUTPUT"
            echo "Effective target_issue=(blank — dispatcher fetch)"
          fi

      - name: Run dispatcher activation
        env:
          DISPATCHER_ACTIVATION_MODE: ${{ steps.mode.outputs.mode }}
          ACTIVATION_MODE: ${{ steps.mode.outputs.mode }}
          DISPATCHER_ACTIVATION_SMOKE_INTERNAL: ${{ steps.mode.outputs.smoke_internal }}
          DISPATCHER_ACTIVATION_TARGET_ISSUE: ${{ steps.target.outputs.target_issue }}
          TARGET_ISSUE: ${{ steps.target.outputs.target_issue }}
          DISPATCHER_ACTIVATION_EVENT_NAME: ${{ github.event_name }}
          DISPATCHER_ACTIVATION_STATE_PATH: .dispatcher-activation-state/dedupe.json
          CURSOR_LIVE_ENABLED: ${{ vars.CURSOR_LIVE_ENABLED || secrets.CURSOR_LIVE_ENABLED || '' }}
          CORPFLOW_CORE_BASE_URL: ${{ secrets.CORPFLOW_CORE_BASE_URL }}
          CORPFLOW_FACTORY_HEALTH_URL: ${{ secrets.CORPFLOW_FACTORY_HEALTH_URL }}
          CORPFLOW_CRON_SECRET: ${{ secrets.CORPFLOW_CRON_SECRET }}
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_JOB: ${{ github.job }}
          GITHUB_SHA: ${{ github.sha }}
          DISPATCHER_ACTIVATION_POST_COMMENT: "1"
        run: node scripts/dispatcher-agent-activation.mjs --fetch --activate --persist-dedupe

      - name: Finalize dispatch claim (labels after Cursor run ID)
        if: ${{ always() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPO: ${{ github.repository }}
          CURSOR_ISSUE_DISPATCH_SCAN_PATH: cursor-issue-dispatch-scan.json
          DISPATCHER_ACTIVATION_PLAN_PATH: activation-plan.json
          CURSOR_OPS_STATUS_PATH: cursor-ops-status.json
        run: |
          set -euo pipefail
          if [ -f cursor-issue-dispatch-scan.json ]; then
            node scripts/cursor-issue-dispatch-finalize.mjs \
              --scan-file cursor-issue-dispatch-scan.json \
              --activation-file activation-plan.json \
              --ops-status-file cursor-ops-status.json || true
          else
            echo "No scan artifact — skip finalize"
          fi

      - name: Upload activation result artifact (always)
        if: ${{ always() }}
        # Pinned SHAs (supply chain): tag v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dispatcher-activation-result
          path: |
            activation-plan.json
            activation-audit.json
            cursor-ops-status.json
            cursor-issue-dispatch-scan.json
            .dispatcher-activation-state/dedupe.json
          if-no-files-found: ignore
          retention-days: 7
