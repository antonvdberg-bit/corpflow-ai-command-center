# CorpFlowAI factory PR state policy.
#
# Anton's only routine human PR action is MERGE. Factory/Cursor PRs must not
# wait in Draft for a manual "Ready for review" click. This workflow converts
# same-repository Cursor factory PRs to normal PRs automatically.
#
# It does NOT merge, approve, deploy, change protected-action gates, execute
# PR code, check out the PR branch, or expose secrets.

name: Factory PR auto-ready

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - converted_to_draft

permissions:
  contents: read
  pull-requests: write

jobs:
  remove-draft-gate:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.pull_request.user.login == 'cursor[bot]' ||
       startsWith(github.event.pull_request.head.ref, 'cursor/'))
    runs-on: ubuntu-latest
    steps:
      - name: Mark completed factory PR ready automatically
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NODE_ID: ${{ github.event.pull_request.node_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api graphql \
            -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{number isDraft}}}' \
            -F id="$PR_NODE_ID" \
            --jq '.data.markPullRequestReadyForReview.pullRequest | "PR #\(.number) draft=\(.isDraft)"'
          echo "Factory PR #${PR_NUMBER} moved directly to operator merge/review inventory."
          echo "No merge or approval was performed."
