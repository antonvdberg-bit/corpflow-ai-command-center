# CIPC Desk private preview verification (issue #640 / PR #643).
#
# Runs only for cursor/cipc-desk-* PR heads. Uses existing GitHub Actions secrets
# (same family as cmp-branch preview verify) — does not ask operators to paste env values.
#
# Secrets (names only; must already exist for CMP preview tooling):
#   VERCEL_TOKEN, VERCEL_PROJECT_ID, optional VERCEL_TEAM_ID
#   VERCEL_AUTOMATION_BYPASS_SECRET and/or CORPFLOW_VERCEL_PROTECTION_BYPASS_SECRET
#   CORPFLOW_TENANT_PREVIEW_SECRET
#
# Uploads screenshots + evidence.json; posts a redacted PR comment.

name: CIPC Desk preview verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
    inputs:
      preview_url:
        description: 'Optional Ready *.vercel.app origin (skip Vercel API lookup)'
        required: false
        type: string
      git_ref:
        description: 'Branch ref when dispatching manually'
        required: false
        default: cursor/cipc-desk-first-visible-slice-029b
        type: string

concurrency:
  group: cipc-desk-preview-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: cipc-desk-preview-smoke
    if: >
      (github.event_name == 'pull_request' && startsWith(github.head_ref, 'cursor/cipc-desk')) ||
      (github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Resolve READY Vercel preview URL (exact head SHA)
        id: vercel
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          INPUT_PREVIEW_URL: ${{ github.event.inputs.preview_url }}
          HEAD_REF: ${{ github.head_ref || github.event.inputs.git_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_PREVIEW_URL:-}" ]; then
            u="${INPUT_PREVIEW_URL%/}"
            echo "preview_url=${u}" >> "$GITHUB_OUTPUT"
            echo "::notice::Using workflow_dispatch preview_url"
            exit 0
          fi

          SHA="${HEAD_SHA}"
          BR="${HEAD_REF}"
          PREVIEW_URL=""

          # Prefer GitHub Deployments API (exact SHA) — no secret value required beyond GITHUB_TOKEN.
          for attempt in $(seq 1 24); do
            PREVIEW_URL="$(SHA="$SHA" REPO="$REPO" GH_TOKEN="$GH_TOKEN" python3 <<'PY'
          import json, os, urllib.request
          sha = os.environ["SHA"].strip()
          repo = os.environ["REPO"].strip()
          token = os.environ["GH_TOKEN"].strip()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/deployments?environment=Preview&per_page=15",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "cipc-desk-preview-verify",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as resp:
              deployments = json.load(resp)
          match = next((d for d in deployments if isinstance(d, dict) and d.get("sha") == sha), None)
          if not match:
              print("")
              raise SystemExit(0)
          st_url = match.get("statuses_url") or ""
          if not st_url:
              print("")
              raise SystemExit(0)
          req2 = urllib.request.Request(
              st_url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "cipc-desk-preview-verify",
              },
          )
          with urllib.request.urlopen(req2, timeout=30) as resp:
              statuses = json.load(resp)
          if not statuses:
              print("")
              raise SystemExit(0)
          top = statuses[0] if isinstance(statuses[0], dict) else {}
          if str(top.get("state") or "").lower() != "success":
              print("")
              raise SystemExit(0)
          u = (top.get("environment_url") or top.get("log_url") or "").strip()
          if u and not u.startswith("http"):
              u = "https://" + u
          print(u.rstrip("/"))
          PY
          )"
            if [ -n "$PREVIEW_URL" ]; then
              echo "::notice::GitHub Deployments API resolved preview for ${SHA}: ${PREVIEW_URL}"
              break
            fi
            echo "Attempt ${attempt}/24: no successful Preview deployment yet for sha=${SHA}; sleeping 15s"
            sleep 15
          done

          # Fallback: Vercel REST (exact SHA only — do not accept older branch deployments).
          if [ -z "$PREVIEW_URL" ] && [ -n "${VERCEL_TOKEN:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ]; then
            Q="projectId=${VERCEL_PROJECT_ID}&limit=40&target=preview"
            if [ -n "${VERCEL_TEAM_ID:-}" ]; then Q="${Q}&teamId=${VERCEL_TEAM_ID}"; fi
            for attempt in $(seq 1 12); do
              curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" "https://api.vercel.com/v6/deployments?${Q}" > /tmp/vercel_deps.json
              PREVIEW_URL="$(SHA="$SHA" python3 <<'PY'
          import json, os
          data = json.load(open("/tmp/vercel_deps.json", encoding="utf-8"))
          ds = data.get("deployments") or []
          sha = (os.environ.get("SHA") or "").strip()
          ready = [
              d for d in ds
              if isinstance(d, dict)
              and d.get("readyState") == "READY"
              and (d.get("meta") or {}).get("githubCommitSha") == sha
          ]
          ready.sort(key=lambda d: d.get("createdAt") or 0, reverse=True)
          u = (ready[0].get("url") if ready else "") or ""
          u = u.strip()
          if u and not u.startswith("http"):
              u = "https://" + u
          print(u.rstrip("/"))
          PY
          )"
              if [ -n "$PREVIEW_URL" ]; then
                echo "::notice::Vercel API resolved preview for ${SHA}: ${PREVIEW_URL}"
                break
              fi
              echo "Vercel attempt ${attempt}/12: no READY deployment for sha=${SHA}; sleeping 15s"
              sleep 15
            done
          fi

          if [ -z "$PREVIEW_URL" ]; then
            echo "::error title=Preview not READY::No successful Preview deployment for sha=${SHA} (ref=${BR})"
            exit 1
          fi
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "::notice::Using preview URL: ${PREVIEW_URL}"

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          cache: npm

      - name: Install + Playwright Chromium
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Run CIPC Desk preview smoke
        id: smoke
        env:
          CIPC_DESK_PREVIEW_BASE_URL: ${{ steps.vercel.outputs.preview_url }}
          CIPC_DESK_SMOKE_OUT_DIR: artifacts/cipc-desk-preview
          CORPFLOW_TENANT_PREVIEW_SECRET: ${{ secrets.CORPFLOW_TENANT_PREVIEW_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          CORPFLOW_VERCEL_PROTECTION_BYPASS_SECRET: ${{ secrets.CORPFLOW_VERCEL_PROTECTION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/cipc-desk-preview
          node scripts/smoke-cipc-desk-preview.mjs | tee artifacts/cipc-desk-preview/smoke-summary.json
          test -f artifacts/cipc-desk-preview/evidence.json

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cipc-desk-preview-evidence
          path: artifacts/cipc-desk-preview/
          if-no-files-found: warn

      - name: Comment redacted evidence on PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_URL: ${{ steps.vercel.outputs.preview_url }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          EVIDENCE="artifacts/cipc-desk-preview/evidence.json"
          if [ ! -f "$EVIDENCE" ]; then
            BODY=$(printf '%s\n' \
              '### CIPC Desk preview verify' \
              "- Preview base: \`${PREVIEW_URL:-unknown}\`" \
              '- Result: **no evidence.json** (smoke did not complete). See workflow logs/artifacts.')
          else
            BODY="$(PREVIEW_URL="$PREVIEW_URL" python3 <<'PY'
          import json, os
          e = json.load(open("artifacts/cipc-desk-preview/evidence.json", encoding="utf-8"))
          checks = e.get("checks") or {}
          lines = [
            "### CIPC Desk preview verify",
            f"- Preview base: `{os.environ.get('PREVIEW_URL') or e.get('preview_base_url')}`",
            f"- Overall ok: **{e.get('ok')}**",
            f"- Mint source: `{e.get('mint_source')}`",
            f"- cf_preview (redacted): `{e.get('cf_preview_url_redacted')}`",
            f"- Fictional data only: **{e.get('fictional_data_only')}**",
            "",
            "Checks:",
          ]
          for k, v in checks.items():
            ok = v.get("ok") if isinstance(v, dict) else bool(v)
            lines.append(f"- `{k}`: {'PASS' if ok else 'FAIL'}")
          lines.append("")
          lines.append("Artifacts: `cipc-desk-preview-evidence` on this workflow run.")
          print("\n".join(lines))
          PY
          )"
          fi
          gh pr comment "$PR" --body "$BODY"
