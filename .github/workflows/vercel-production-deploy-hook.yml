# Fallback when Vercel does not auto-deploy on push to GitHub.
#
# Protected-action gate (#676):
# - Job uses GitHub Environment `Production` (required reviewers configured by Anton).
# - Durable corpflow.protected_approval.v1 marker must match action=deploy + SHA + environment.
# - Labels alone are not approval. Merge alone does not authorize this hook.
#
# Setup (once):
# 1) Vercel → your project → Settings → Git → Deploy Hooks → Create Hook
#    (Branch: main, or your production branch)
# 2) GitHub → this repo → Settings → Secrets and variables → Actions → New repository secret
#    Name: VERCEL_DEPLOY_HOOK_URL   Value: the hook URL from step 1
# 3) GitHub → Environments → Production → Required reviewers = Anton
# 4) Record durable approval on the linked issue/PR, then
#    Actions → "Trigger Vercel production (deploy hook)" → Run workflow
#
# This does not run on every push (avoids double deploys if Git integration starts working again).

name: Trigger Vercel production (deploy hook)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number holding the durable deploy approval marker"
        required: true
        type: string
      target_sha:
        description: "Commit SHA approved for production deploy"
        required: true
        type: string
      approval_comment_json:
        description: "Optional JSON array of comment bodies (synthetic/tests). Leave empty to fetch issue comments."
        required: false
        default: ""
        type: string

permissions:
  contents: read
  issues: read

jobs:
  hook:
    runs-on: ubuntu-latest
    environment: Production
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      # Pinned SHAs (supply chain): tag v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Pinned SHAs (supply chain): tag v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "20"

      - name: Verify durable deploy approval
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TARGET_SHA: ${{ inputs.target_sha }}
          APPROVAL_COMMENT_JSON: ${{ inputs.approval_comment_json }}
        run: |
          set -euo pipefail
          COMMENTS_FILE="$(mktemp)"
          if [ -n "${APPROVAL_COMMENT_JSON}" ]; then
            printf '%s' "${APPROVAL_COMMENT_JSON}" > "${COMMENTS_FILE}"
          else
            gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" --paginate \
              --jq '[.[].body]' > "${COMMENTS_FILE}"
          fi
          node scripts/check-protected-action-gate.mjs \
            --action=deploy \
            --issue="${ISSUE_NUMBER}" \
            --sha="${TARGET_SHA}" \
            --environment=production \
            --labels="needs:anton,approval:deploy" \
            --comments-file="${COMMENTS_FILE}"

      - name: POST Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${HOOK:-}" ]; then
            echo "::error::Missing repository secret VERCEL_DEPLOY_HOOK_URL. See workflow file header."
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
          echo "OK — Vercel accepted the hook. Open Vercel → Deployments to confirm a new build."
