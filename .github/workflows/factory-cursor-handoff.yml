# Legacy diagnostic only (#929). Not an execution authority.
#
# Production Cursor execution is Factory dispatcher activate → Background
# Agents API (existing CURSOR_API_KEY). Native Automation MODE B must not
# auto-wake from this workflow.
#
# Displayed name is intentionally NOT the exact former production trigger
# "CorpFlowAI Cursor Factory Handoff" so configured native Automation cannot
# treat this as the production wake signal.
#
# Manual workflow_dispatch only. No issues/comment/capacity/schedule triggers.

name: CorpFlowAI Cursor Factory Handoff (legacy diagnostic)

on:
  workflow_dispatch:
    inputs:
      target_issue:
        description: "Optional preferred GitHub issue number (blank = highest eligible)"
        required: false
        default: ""
        type: string
      wake_reason:
        description: "manual_dispatch diagnostic only — not an execution authority"
        required: false
        default: manual_dispatch
        type: string

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: factory-cursor-handoff-diagnostic-${{ inputs.target_issue || 'scan' }}
  cancel-in-progress: false

jobs:
  handoff:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    outputs:
      has_handoff: ${{ steps.handoff.outputs.has_handoff }}
      source_issue: ${{ steps.handoff.outputs.source_issue }}
      reason: ${{ steps.handoff.outputs.reason }}

    steps:
      # Pinned SHAs (supply chain): tag v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Pinned SHAs (supply chain): tag v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "20"

      - name: Select one eligible source issue and publish diagnostic packet
        id: handoff
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action || '' }}
          EVENT_LABEL: ${{ github.event.label.name || '' }}
          EVENT_ISSUE_STATE: ${{ github.event.issue.state || '' }}
          EVENT_ISSUE_NUMBER: ${{ github.event.issue.number || '' }}
          EVENT_ISSUE_LABELS: ${{ github.event_name == 'issues' && join(github.event.issue.labels.*.name, ',') || '' }}
          EVENT_COMMENT_BODY: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
          EVENT_ACTOR_LOGIN: ${{ github.event_name == 'issue_comment' && github.event.comment.user.login || github.actor || '' }}
          EVENT_COMMENT_AUTHOR_ASSOCIATION: ${{ github.event_name == 'issue_comment' && github.event.comment.author_association || '' }}
          TARGET_ISSUE_INPUT: ${{ inputs.target_issue || '' }}
          WAKE_REASON_INPUT: ${{ inputs.wake_reason || '' }}
          CAPACITY_WAKE_REQUESTED: ""
          FACTORY_HANDOFF_OUT_PATH: factory-cursor-handoff.json
          # Diagnostic artifacts only — do not post an execution-authority comment.
          FACTORY_HANDOFF_POST_COMMENT: "0"
        run: |
          set -euo pipefail
          node scripts/factory-cursor-handoff.mjs

      - name: Upload diagnostic handoff artifact
        if: always()
        continue-on-error: true
        # Pinned SHAs (supply chain): tag v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: factory-cursor-handoff
          path: factory-cursor-handoff.json
          if-no-files-found: ignore
          retention-days: 7
