name: WMA Firecrawl extraction

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Approved public URL to crawl'
        required: true
        default: 'https://corpflowai.com'
        type: string
      page_limit:
        description: 'Maximum public pages (1-100)'
        required: true
        default: '25'
        type: string

concurrency:
  group: wma-firecrawl-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  extract:
    name: wma-firecrawl-extract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'

      - name: Confirm Firecrawl secret contract
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${FIRECRAWL_API_KEY:-}" ]; then
            echo '::error title=Missing WMA secret::FIRECRAWL_API_KEY is not configured in GitHub Actions secrets.'
            exit 1
          fi
          echo 'Firecrawl credential is available (value not printed).'

      - name: Run bounded public extraction
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          WMA_TARGET_URL: ${{ inputs.target_url }}
          WMA_CRAWL_LIMIT: ${{ inputs.page_limit }}
          WMA_FIRECRAWL_OUT_DIR: artifacts/wma-firecrawl
        run: |
          set -euo pipefail
          node scripts/wma-firecrawl-extract.mjs
          test -f artifacts/wma-firecrawl/summary.json
          test -f artifacts/wma-firecrawl/pages.json

      - name: Upload WMA Firecrawl evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wma-firecrawl-evidence-${{ github.run_id }}
          path: artifacts/wma-firecrawl/
          if-no-files-found: warn
