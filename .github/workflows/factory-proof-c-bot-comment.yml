name: Factory proof C bot comment

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/factory-proof-c-bot-comment.yml'

permissions:
  contents: read
  issues: write

jobs:
  post-execute-comment:
    runs-on: ubuntu-latest
    steps:
      - name: Post CURSOR FACTORY EXECUTE to issue 908
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/issues/908/comments" \
            -f body='CURSOR FACTORY EXECUTE'
