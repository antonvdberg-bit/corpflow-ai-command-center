name: Business Admin Desk domain attach

on:
  push:
    branches:
      - brand/business-admin-desk-logo
    paths:
      - .github/workflows/business-admin-desk-domain-attach.yml

permissions:
  contents: read

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Attach approved Business Admin Desk domains
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}"
          test -n "${VERCEL_PROJECT_ID:-}"
          for DOMAIN in businessadmindesk.co.za www.businessadmindesk.co.za; do
            BODY=$(mktemp)
            CODE=$(curl -sS -o "$BODY" -w "%{http_code}" -X POST               -H "Authorization: Bearer $VERCEL_TOKEN"               -H "Content-Type: application/json"               "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/domains?teamId=$VERCEL_TEAM_ID"               -d "{\"name\":\"$DOMAIN\"}")
            if [ "$CODE" = "200" ] || [ "$CODE" = "201" ]; then
              echo "Attached: $DOMAIN"
            elif { [ "$CODE" = "400" ] || [ "$CODE" = "409" ]; } && grep -qiE 'already|exists|domain_already_in_use' "$BODY"; then
              echo "Already attached or assigned: $DOMAIN"
            else
              echo "::error::Failed to attach $DOMAIN (HTTP $CODE)"
              cat "$BODY"
              exit 1
            fi
          done
          echo "Domain attachment requests completed."
          curl -fsS -X PATCH \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains/www.businessadmindesk.co.za?teamId=$VERCEL_TEAM_ID" \
            -d '{"redirect":"businessadmindesk.co.za","redirectStatusCode":308}' \
            | jq '{name, verified, redirect, redirectStatusCode}'

          curl -fsS \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID/domains?teamId=$VERCEL_TEAM_ID&limit=100" \
            | jq '{domains: [.domains[] | select(.name == "businessadmindesk.co.za" or .name == "www.businessadmindesk.co.za") | {name, verified, redirect, redirectStatusCode, gitBranch, verification}]}'

          for DOMAIN in businessadmindesk.co.za www.businessadmindesk.co.za; do
            echo "CONFIG $DOMAIN"
            curl -fsS \
              -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/domains/$DOMAIN/config?teamId=$VERCEL_TEAM_ID&projectIdOrName=$VERCEL_PROJECT_ID" \
              | jq '{configuredBy, misconfigured, recommendedIPv4, recommendedCNAME, acceptedChallenges}'
          done
