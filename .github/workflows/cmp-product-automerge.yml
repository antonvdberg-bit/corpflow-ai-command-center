# Product automation: after Agent CI succeeds on a PR from cmp/<ticket_id>, merge into main.
# Vercel (or your host) should deploy production on pushes to main — no manual Cursor push required.
#
# Enable with GitHub repo variable: CMP_AUTO_MERGE = true
# Disable (default): omit the variable or set to anything other than true.
#
# Hardening (#676):
# - Agent branches (cursor/*, codex/*, internal-agent/*) never auto-merge.
# - needs:anton blocks auto-merge until the Decision Inbox item is cleared.
# - client-approved + CI green is still required for cmp/* only.
# - Labels alone are not a protected production/deploy approval.

name: CMP product auto-merge

on:
  workflow_run:
    workflows: ['Agent CI']
    types:
      - completed

jobs:
  merge-cmp-pr:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      vars.CMP_AUTO_MERGE == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Pinned SHAs (supply chain): tag v6
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Pinned SHAs (supply chain): tag v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: "20"

      - name: Merge open PR for cmp branch (after client approval)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const { execFileSync } = require('node:child_process');
            const run = context.payload.workflow_run;
            const headBranch = run.head_branch || '';
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const head = `${owner}:${headBranch}`;

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base: 'main',
              per_page: 5,
            });

            if (!prs.length) {
              core.info(`No open PR found for head=${head} base=main`);
              return;
            }

            const pr = prs[0];
            const labels = Array.isArray(pr.labels)
              ? pr.labels.map((l) => (l && l.name ? String(l.name) : '')).filter(Boolean)
              : [];

            let gateJson = '';
            let gateCode = 0;
            try {
              gateJson = execFileSync(
                process.execPath,
                [
                  'scripts/check-protected-action-gate.mjs',
                  '--mode=auto-merge',
                  `--branch=${headBranch}`,
                  `--labels=${labels.join(',')}`,
                  '--cmp-auto-merge=true',
                  `--conclusion=${run.conclusion || ''}`,
                ],
                { encoding: 'utf8' },
              );
            } catch (err) {
              gateCode = err && typeof err.status === 'number' ? err.status : 1;
              gateJson = String((err && err.stdout) || '') || String((err && err.message) || '');
            }

            let gate = null;
            try {
              gate = JSON.parse(gateJson);
            } catch {
              if (gateCode === 2) {
                core.info(`Skip: auto-merge gate blocked PR #${pr.number} (exit 2): ${gateJson.slice(0, 400)}`);
                return;
              }
              core.setFailed(`Auto-merge gate returned invalid JSON: ${gateJson.slice(0, 400)}`);
              return;
            }
            if (!gate.allowed) {
              core.info(`Skip: auto-merge gate blocked PR #${pr.number}: ${gate.reason}`);
              return;
            }

            core.info(`Merging PR #${pr.number} (${pr.html_url})`);

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              // Repo rules disallow merge commits; use squash for promotion.
              merge_method: 'squash',
            });

            core.info('Merge completed');
