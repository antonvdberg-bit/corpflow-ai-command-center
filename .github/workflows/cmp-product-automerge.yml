# CMP product auto-merge — ONLY for client-approved cmp/* PRs when explicitly enabled.
#
# Enable with GitHub repo variable: CMP_AUTO_MERGE = true
# Disable (default): omit the variable or set to anything other than true.
#
# #676 / Decision Inbox: agent PRs (cursor/*, codex/*, docs/*, feat/*, …) must NEVER
# auto-merge. This workflow already restricts head branches to cmp/* only — do not widen.
# Labels (including needs:anton / approval:*) are not merge authority.

name: CMP product auto-merge

on:
  workflow_run:
    workflows: ['Agent CI']
    types:
      - completed

jobs:
  merge-cmp-pr:
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      vars.CMP_AUTO_MERGE == 'true'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge open PR for cmp branch (after client approval)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const run = context.payload.workflow_run;
            const headBranch = run.head_branch || '';
            // Hard allowlist — never auto-merge agent executor branches.
            if (!headBranch.startsWith('cmp/')) {
              core.info(`Skip: head branch is not cmp/* (${headBranch})`);
              return;
            }
            if (
              headBranch.startsWith('cursor/') ||
              headBranch.startsWith('codex/') ||
              headBranch.startsWith('docs/') ||
              headBranch.startsWith('feat/') ||
              headBranch.startsWith('fix/')
            ) {
              core.info(`Skip: agent/executor branch namespace blocked from auto-merge (${headBranch})`);
              return;
            }
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');
            const head = `${owner}:${headBranch}`;

            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head,
              base: 'main',
              per_page: 5,
            });

            if (!prs.length) {
              core.info(`No open PR found for head=${head} base=main`);
              return;
            }

            const pr = prs[0];
            const labels = Array.isArray(pr.labels) ? pr.labels.map(l => (l && l.name ? String(l.name) : '')).filter(Boolean) : [];
            if (!labels.includes('client-approved')) {
              core.info(`Skip: PR #${pr.number} missing label client-approved (client signoff not recorded).`);
              return;
            }
            // needs:anton / approval:* route Decision Inbox work — they do not unlock merge.
            if (labels.includes('needs:anton')) {
              core.info(`Skip: PR #${pr.number} still labelled needs:anton (Decision Inbox open).`);
              return;
            }
            core.info(`Merging PR #${pr.number} (${pr.html_url})`);

            await github.rest.pulls.merge({
              owner,
              repo,
              pull_number: pr.number,
              // Repo rules disallow merge commits; use squash for promotion.
              merge_method: 'squash',
            });

            core.info('Merge completed');
