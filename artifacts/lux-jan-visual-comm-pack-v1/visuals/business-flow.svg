<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" role="img" aria-labelledby="title desc">
  <title id="title">Rare &amp; Exclusive  business flow</title>
  <desc id="desc">New Enquiry through Viewing and Deal Progress.</desc>
  <rect width="1100" height="280" fill="#F4EFE8"/>
  <text x="40" y="40" fill="#A8842C" font-family="Georgia, serif" font-size="13" letter-spacing="2">BUSINESS FLOW</text>
  <text x="40" y="70" fill="#111111" font-family="Georgia, serif" font-size="24">From first enquiry to viewing</text>

  <!-- Steps -->
  <g font-family="system-ui, sans-serif">
    <rect x="40" y="110" width="170" height="100" rx="3" fill="#111111"/>
    <text x="55" y="145" fill="#A8842C" font-size="12">01</text>
    <text x="55" y="170" fill="#F4EFE8" font-size="14" font-family="Georgia, serif">New Enquiry</text>
    <text x="55" y="192" fill="rgba(244,239,232,0.7)" font-size="11">Website / concierge</text>

    <path d="M220 160 L248 160" stroke="#A8842C" stroke-width="1.5" marker-end="url(#arr)"/>

    <rect x="258" y="110" width="170" height="100" rx="3" fill="#111111"/>
    <text x="273" y="145" fill="#A8842C" font-size="12">02</text>
    <text x="273" y="170" fill="#F4EFE8" font-size="14" font-family="Georgia, serif">Client Review</text>
    <text x="273" y="192" fill="rgba(244,239,232,0.7)" font-size="11">Active / qualified</text>

    <path d="M438 160 L466 160" stroke="#A8842C" stroke-width="1.5"/>

    <rect x="476" y="110" width="170" height="100" rx="3" fill="#111111"/>
    <text x="491" y="145" fill="#A8842C" font-size="12">03</text>
    <text x="491" y="170" fill="#F4EFE8" font-size="14" font-family="Georgia, serif">Next Action</text>
    <text x="491" y="192" fill="rgba(244,239,232,0.7)" font-size="11">Who does what next</text>

    <path d="M656 160 L684 160" stroke="#A8842C" stroke-width="1.5"/>

    <rect x="694" y="110" width="170" height="100" rx="3" fill="#111111"/>
    <text x="709" y="145" fill="#A8842C" font-size="12">04</text>
    <text x="709" y="170" fill="#F4EFE8" font-size="14" font-family="Georgia, serif">Private Draft</text>
    <text x="709" y="192" fill="rgba(244,239,232,0.7)" font-size="11">Invitation / presentation</text>

    <path d="M874 160 L902 160" stroke="#A8842C" stroke-width="1.5"/>

    <rect x="912" y="110" width="150" height="100" rx="3" fill="#A8842C"/>
    <text x="927" y="145" fill="#111111" font-size="12">05</text>
    <text x="927" y="170" fill="#111111" font-size="14" font-family="Georgia, serif">Viewing / Deal</text>
    <text x="927" y="192" fill="rgba(17,17,17,0.75)" font-size="11">Progress forward</text>
  </g>
  <text x="40" y="250" fill="#6B6256" font-family="system-ui, sans-serif" font-size="12">Same journey Jan already sees in pieces on the test desk  shown here as one clear path.</text>
</svg>
